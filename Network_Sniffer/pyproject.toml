[project]
name = "network-sniffer"
version = "0.1.0"
description = "Network sniffer and packet analyzer"
readme = "README.md"
authors = [
    { name = "TAHA", email = "james@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "scapy>=2.6.0",
]

[project.scripts]
network-sniffer = "network_sniffer:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"